<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Scramjet Proxy — Chrome-like UI (Dark Blue)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">S</div>
        <div class="title">Scramjet</div>
      </div>
      <nav>
        <button class="nav-btn active">Browse</button>
        <button class="nav-btn">Bookmarks</button>
        <button class="nav-btn">History</button>
        <button class="nav-btn">Settings</button>
      </nav>
      <div class="sidebar-footer">v1.0</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="window-controls">
          <span class="dot close"></span>
          <span class="dot minimize"></span>
          <span class="dot maximize"></span>
        </div>

        <div class="address-group">
          <button id="backBtn" class="ctrl">◀</button>
          <button id="forwardBtn" class="ctrl">▶</button>

          <input id="urlInput" type="text" placeholder="Enter a URL (https://example.com)" />
          <button id="goBtn" class="go">Go</button>

          <div class="profile"> </div>
        </div>
      </header>

      <div class="content">
        <iframe id="viewport" src="/proxy?url=https://example.com" frameborder="0"></iframe>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
